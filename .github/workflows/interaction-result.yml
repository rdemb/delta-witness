name: Interaction result

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

concurrency:
  group: interaction-result-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Interaction result / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency-free editable package
        run: python -m pip install --no-deps -e .

      - name: Download the exact reviewed Coverage.py wheel
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/coveragepy-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m pip download \
            --dest "$wheelhouse" \
            --require-hashes \
            --no-deps \
            --only-binary=:all: \
            --platform any \
            --implementation py \
            --abi none \
            --python-version "${{ matrix.python-version }}" \
            -r research/requirements-coveragepy-v1.txt
          test "$(find "$wheelhouse" -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Verify and install Coverage.py offline
        shell: bash
        run: |
          set -euo pipefail
          wheel="${RUNNER_TEMP}/coveragepy-wheelhouse/coverage-7.15.2-py3-none-any.whl"
          python scripts/verify_coveragepy_artifact.py "$wheel"
          python -m pip install --no-index --no-deps "$wheel"

      - name: Verify exact runtime identity and inactive auto-start
        run: |
          python - <<'PY'
          import importlib.metadata
          import coverage

          assert importlib.metadata.version("coverage") == "7.15.2"
          assert coverage.__version__ == "7.15.2"
          assert coverage.Coverage.current() is None
          PY

      - name: Run editable interaction result and capture semantic identity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/smoke_dw001_interaction_lattice_result.py
          python scripts/smoke_dw001_interaction_lattice_result.py \
            --semantic-digest > "${RUNNER_TEMP}/editable-semantic.txt"

      - name: Emit canonical public-safe result for freezing
        if: matrix.python-version == '3.11'
        run: python scripts/smoke_dw001_interaction_lattice_result.py --emit-json

      - name: Reproduce from the force-reinstalled base wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps --force-reinstall dist/deltawitness-*.whl
          installed_digest="$(python scripts/smoke_dw001_interaction_lattice_result.py --semantic-digest)"
          editable_digest="$(cat "${RUNNER_TEMP}/editable-semantic.txt")"
          test "$editable_digest" = "$installed_digest"
          echo "Interaction result semantic reproduction passed: ${installed_digest}"

      - name: Remove Coverage.py and preserve the base path
        run: |
          python -m pip uninstall --yes coverage
          python - <<'PY'
          import importlib.util
          import sys

          assert importlib.util.find_spec("coverage") is None
          from deltawitness.dw001_interaction_lattice_execution import (
              build_interaction_lattice_execution_protocol,
          )
          from deltawitness.dw001_interaction_lattice_result import (
              verify_interaction_witness_lattice_result_document,
          )
          assert "coverage" not in sys.modules
          assert build_interaction_lattice_execution_protocol()[
              "execution_scope"
          ]["maximum_selector_commands"] == 24
          assert callable(verify_interaction_witness_lattice_result_document)
          PY
          python scripts/smoke_dw001_interaction_lattice_plan.py
