name: Recover claim-relevant path preregistration transport

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

concurrency:
  group: recover-claim-relevant-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-truncated-transport:
    name: Inspect truncated preregistration transport
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/claim-relevant-path-divergence-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Recover and attest complete tar members without extraction
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor \
            d16101cba0ea074c1750b8d4336409a9ff15dabc \
            HEAD
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path, PurePosixPath
          import zlib

          archive = Path(
              "research/DW-001/"
              ".claim-relevant-path-preregistration.bundle.tar.gz"
          )
          raw = archive.read_bytes()
          expected_raw_sha256 = (
              "8aee966cbbe5b2cff5b792923e0c3831"
              "ddf44abd0cb7827da3dcf48d2e4f7d54"
          )
          observed_raw_sha256 = hashlib.sha256(raw).hexdigest()
          if observed_raw_sha256 != expected_raw_sha256:
              raise SystemExit(
                  "transport identity mismatch: "
                  f"{observed_raw_sha256} != {expected_raw_sha256}"
              )

          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          decompressed = bytearray()
          error: str | None = None
          for offset in range(0, len(raw), 32):
              chunk = raw[offset : offset + 32]
              try:
                  decompressed.extend(inflater.decompress(chunk))
              except zlib.error as exc:
                  error = f"offset={offset}: {exc}"
                  break
          if error is None:
              try:
                  decompressed.extend(inflater.flush())
              except zlib.error as exc:
                  error = f"flush: {exc}"

          print(
              "TRANSPORT\t"
              f"raw_bytes={len(raw)}\t"
              f"raw_sha256={observed_raw_sha256}\t"
              f"decompressed_bytes={len(decompressed)}\t"
              f"gzip_eof={inflater.eof}\t"
              f"zlib_error={error!r}"
          )

          def parse_octal(raw_value: bytes, *, field: str, name: str) -> int:
              value = raw_value.rstrip(b"\0 ").lstrip(b" ")
              if not value:
                  return 0
              try:
                  return int(value, 8)
              except ValueError as exc:
                  raise SystemExit(
                      f"invalid tar {field} for {name!r}: {raw_value!r}"
                  ) from exc

          offset = 0
          complete: list[tuple[str, bytes]] = []
          partial: tuple[str, int, int] | None = None
          while offset + 512 <= len(decompressed):
              header = bytes(decompressed[offset : offset + 512])
              if header == b"\0" * 512:
                  break

              stored_checksum = parse_octal(
                  header[148:156], field="checksum", name="<pending>"
              )
              computed_checksum = sum(header[:148]) + (32 * 8) + sum(header[156:])
              if stored_checksum != computed_checksum:
                  raise SystemExit(
                      "tar checksum mismatch at block "
                      f"{offset // 512}: {stored_checksum} != {computed_checksum}"
                  )

              name_bytes = header[:100].split(b"\0", 1)[0]
              prefix_bytes = header[345:500].split(b"\0", 1)[0]
              try:
                  name = name_bytes.decode("utf-8")
                  prefix = prefix_bytes.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit("tar member name is not UTF-8") from exc
              if prefix:
                  name = f"{prefix}/{name}"
              path = PurePosixPath(name)
              if not name or path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"unsafe tar member path: {name!r}")

              typeflag = header[156:157]
              if typeflag not in {b"\0", b"0"}:
                  raise SystemExit(
                      f"non-regular tar member rejected: {name!r}, "
                      f"type={typeflag!r}"
                  )
              size = parse_octal(header[124:136], field="size", name=name)
              content_start = offset + 512
              content_end = content_start + size
              padded_end = content_start + ((size + 511) // 512) * 512
              available = max(0, len(decompressed) - content_start)
              if padded_end > len(decompressed):
                  partial = (name, size, min(size, available))
                  break

              content = bytes(decompressed[content_start:content_end])
              complete.append((name, content))
              offset = padded_end

          names = [name for name, _ in complete]
          if len(names) != len(set(names)):
              raise SystemExit("duplicate complete tar member names")

          print(f"COMPLETE_MEMBER_COUNT\t{len(complete)}")
          for name, content in complete:
              print(
                  "COMPLETE_MEMBER\t"
                  f"{name}\t{len(content)}\t"
                  f"{hashlib.sha256(content).hexdigest()}\t"
                  f"{base64.b64encode(content).decode('ascii')}"
              )
          if partial is None:
              print("PARTIAL_MEMBER\tnone")
          else:
              print(
                  "PARTIAL_MEMBER\t"
                  f"{partial[0]}\texpected={partial[1]}\t"
                  f"available={partial[2]}"
              )

          print(
              "RECOVERY_SUMMARY\t"
              f"complete={len(complete)}\t"
              f"partial={partial[0] if partial else None!r}\t"
              f"remaining_decompressed_bytes={len(decompressed) - offset}"
          )
          PY
