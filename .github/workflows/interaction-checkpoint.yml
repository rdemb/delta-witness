name: Recover claim-relevant path preregistration transport

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

concurrency:
  group: recover-claim-relevant-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-truncated-transport:
    name: Inspect truncated preregistration transport
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/claim-relevant-path-divergence-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Recover and attest complete tar members without extraction
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor \
            d16101cba0ea074c1750b8d4336409a9ff15dabc \
            HEAD
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          from pathlib import Path, PurePosixPath
          import tarfile
          import zlib

          archive = Path(
              "research/DW-001/"
              ".claim-relevant-path-preregistration.bundle.tar.gz"
          )
          raw = archive.read_bytes()
          expected_raw_sha256 = (
              "8aee966cbbe5b2cff5b792923e0c3831"
              "ddf44abd0cb7827da3dcf48d2e4f7d54"
          )
          observed_raw_sha256 = hashlib.sha256(raw).hexdigest()
          if observed_raw_sha256 != expected_raw_sha256:
              raise SystemExit(
                  "transport identity mismatch: "
                  f"{observed_raw_sha256} != {expected_raw_sha256}"
              )

          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          decompressed = bytearray()
          zlib_error: str | None = None
          for offset in range(0, len(raw), 32):
              try:
                  decompressed.extend(
                      inflater.decompress(raw[offset : offset + 32])
                  )
              except zlib.error as exc:
                  zlib_error = f"offset={offset}: {exc}"
                  break
          if zlib_error is None:
              try:
                  decompressed.extend(inflater.flush())
              except zlib.error as exc:
                  zlib_error = f"flush: {exc}"

          print(
              "TRANSPORT\t"
              f"raw_bytes={len(raw)}\t"
              f"raw_sha256={observed_raw_sha256}\t"
              f"decompressed_bytes={len(decompressed)}\t"
              f"gzip_eof={inflater.eof}\t"
              f"zlib_error={zlib_error!r}"
          )

          expected = {
              ".github/workflows/claim-relevant-path-preregistration.yml",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_ARCHITECTURE_V1.md",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_PLAN_V1.md",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_PUBLICATION_BOUNDARY_V1.md",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_RED_FIRST_V1.md",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_THREAT_BOUNDARY_V1.md",
              "research/DW-001/claim-relevant-path-divergence-catalog.v1.json",
              "research/DW-001/claim-relevant-path-divergence-plan.v1.json",
              "research/DW-001/claim-relevant-path-prior-art-log.v1.json",
              "research/DW-001/schema/claim-relevant-path-divergence-catalog.schema.json",
              "research/DW-001/schema/claim-relevant-path-divergence-plan.schema.json",
              "research/DW-001/schema/claim-relevant-path-prior-art-log.schema.json",
              "scripts/smoke_dw001_claim_relevant_path_plan.py",
              "src/deltawitness/dw001_claim_relevant_path_plan.py",
              "tests/test_dw001_claim_relevant_path_adversarial.py",
              "tests/test_dw001_claim_relevant_path_preregistration.py",
              "tests/test_dw001_claim_relevant_path_schemas.py",
          }
          complete: list[tuple[str, bytes]] = []
          partial_name: str | None = None
          stream_error: str | None = None

          try:
              with tarfile.open(
                  fileobj=io.BytesIO(bytes(decompressed)), mode="r|"
              ) as handle:
                  while True:
                      try:
                          member = handle.next()
                      except (tarfile.ReadError, EOFError) as exc:
                          stream_error = f"member-header: {exc}"
                          break
                      if member is None:
                          break
                      name = member.name
                      path = PurePosixPath(name)
                      if not name or path.is_absolute() or ".." in path.parts:
                          raise SystemExit(f"unsafe tar member path: {name!r}")
                      if not member.isfile():
                          raise SystemExit(
                              "non-regular effective tar member rejected: "
                              f"{name!r}, type={member.type!r}"
                          )
                      if name not in expected:
                          raise SystemExit(
                              f"unexpected effective tar member: {name!r}"
                          )
                      try:
                          source = handle.extractfile(member)
                          if source is None:
                              raise tarfile.ReadError("member is unreadable")
                          content = source.read()
                      except (tarfile.ReadError, EOFError) as exc:
                          partial_name = name
                          stream_error = f"member-content: {exc}"
                          break
                      if len(content) != member.size:
                          partial_name = name
                          stream_error = (
                              "member-content: short read "
                              f"{len(content)} != {member.size}"
                          )
                          break
                      complete.append((name, content))
          except tarfile.ReadError as exc:
              stream_error = f"archive-open: {exc}"

          names = [name for name, _ in complete]
          if len(names) != len(set(names)):
              raise SystemExit("duplicate complete effective member names")

          print(f"COMPLETE_MEMBER_COUNT\t{len(complete)}")
          for name, content in complete:
              print(
                  "COMPLETE_MEMBER\t"
                  f"{name}\t{len(content)}\t"
                  f"{hashlib.sha256(content).hexdigest()}\t"
                  f"{base64.b64encode(content).decode('ascii')}"
              )
          print(
              "RECOVERY_SUMMARY\t"
              f"complete={len(complete)}\t"
              f"partial={partial_name!r}\t"
              f"missing={sorted(expected - set(names))!r}\t"
              f"stream_error={stream_error!r}"
          )
          PY
