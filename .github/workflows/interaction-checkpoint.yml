name: Export claim-relevant path branch tree

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

concurrency:
  group: export-claim-relevant-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-branch-tree:
    name: Export exact branch tree
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/claim-relevant-path-divergence-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact head and create deterministic Git archive
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git diff --quiet
          git diff --cached --quiet
          git archive \
            --format=tar \
            --prefix=delta-witness/ \
            --output=claim-relevant-path-branch.tar \
            HEAD
          sha256sum claim-relevant-path-branch.tar \
            > claim-relevant-path-branch.tar.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          partial = Path(
              "research/DW-001/.claim-relevant-path-transport-recovery/"
              "dw001_claim_relevant_path_plan.py.partial"
          ).read_bytes()
          metadata = json.loads(
              Path(
                  "research/DW-001/.claim-relevant-path-transport-recovery/"
                  "recovery-metadata.v1.json"
              ).read_text(encoding="utf-8")
          )
          assert len(partial) == 32768
          assert hashlib.sha256(partial).hexdigest() == (
              "ff4da3962fda78d5cc390632388c5256"
              "87ae48e694fa215099a0c3c115d03c22"
          )
          assert metadata["member_partial_sha256"] == hashlib.sha256(partial).hexdigest()
          assert metadata["execution_authorized"] is False
          PY

      - name: Upload exact branch archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: claim-relevant-path-branch-${{ github.event.pull_request.head.sha }}
          path: |
            claim-relevant-path-branch.tar
            claim-relevant-path-branch.tar.sha256
          if-no-files-found: error
          retention-days: 1
