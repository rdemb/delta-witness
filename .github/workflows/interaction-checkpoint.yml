name: Export claim-relevant path recovery bytes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

concurrency:
  group: export-claim-relevant-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-recovery-bytes:
    name: Export exact recovery bytes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/claim-relevant-path-divergence-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact recovery identities
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path(
              "research/DW-001/.claim-relevant-path-transport-recovery"
          )
          partial = root / "dw001_claim_relevant_path_plan.py.partial"
          metadata_path = root / "recovery-metadata.v1.json"
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          raw = partial.read_bytes()
          assert len(raw) == 32768
          assert hashlib.sha256(raw).hexdigest() == (
              "ff4da3962fda78d5cc390632388c5256"
              "87ae48e694fa215099a0c3c115d03c22"
          )
          assert metadata["member_available_bytes"] == len(raw)
          assert metadata["member_partial_sha256"] == hashlib.sha256(raw).hexdigest()
          assert metadata["member_complete"] is False
          assert metadata["execution_authorized"] is False
          PY

      - name: Upload exact recovery evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: claim-relevant-path-recovery-${{ github.event.pull_request.head.sha }}
          path: research/DW-001/.claim-relevant-path-transport-recovery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
