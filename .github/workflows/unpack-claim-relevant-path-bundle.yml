name: Unpack claim-relevant path preregistration bundle

on:
  push:
    branches:
      - research/claim-relevant-path-divergence-v1
    paths:
      - research/DW-001/.claim-relevant-path-preregistration.bundle.tar.gz
      - .github/workflows/unpack-claim-relevant-path-bundle.yml

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

concurrency:
  group: unpack-claim-relevant-path-preregistration
  cancel-in-progress: false

jobs:
  unpack-verify-and-remove-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/claim-relevant-path-divergence-v1
          fetch-depth: 0

      - name: Verify and extract exact regular-file set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import shutil
          import tarfile

          archive = Path(
              "research/DW-001/.claim-relevant-path-preregistration.bundle.tar.gz"
          )
          expected_sha256 = (
              "1b6e4b8bf2c85636be94832a8cb0b36803d6cd75043adeb2a08255e529564c5f"
          )
          expected = {
              ".github/workflows/claim-relevant-path-preregistration.yml",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_ARCHITECTURE_V1.md",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_PLAN_V1.md",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_PUBLICATION_BOUNDARY_V1.md",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_RED_FIRST_V1.md",
              "research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_THREAT_BOUNDARY_V1.md",
              "research/DW-001/claim-relevant-path-divergence-catalog.v1.json",
              "research/DW-001/claim-relevant-path-divergence-plan.v1.json",
              "research/DW-001/claim-relevant-path-prior-art-log.v1.json",
              "research/DW-001/schema/claim-relevant-path-divergence-catalog.schema.json",
              "research/DW-001/schema/claim-relevant-path-divergence-plan.schema.json",
              "research/DW-001/schema/claim-relevant-path-prior-art-log.schema.json",
              "scripts/smoke_dw001_claim_relevant_path_plan.py",
              "src/deltawitness/dw001_claim_relevant_path_plan.py",
              "tests/test_dw001_claim_relevant_path_adversarial.py",
              "tests/test_dw001_claim_relevant_path_preregistration.py",
              "tests/test_dw001_claim_relevant_path_schemas.py",
          }

          observed_sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          if observed_sha256 != expected_sha256:
              raise SystemExit(
                  f"bundle digest mismatch: {observed_sha256} != {expected_sha256}"
              )

          stage = Path(".claim-relevant-path-bundle-stage")
          if stage.exists():
              raise SystemExit("staging path already exists")
          stage.mkdir()

          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit("bundle contains duplicate member names")
              if set(names) != expected:
                  raise SystemExit(
                      f"bundle member mismatch: missing={sorted(expected-set(names))!r} "
                      f"extra={sorted(set(names)-expected)!r}"
                  )
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe member path: {member.name!r}")
                  if not member.isfile():
                      raise SystemExit(
                          f"non-regular bundle member rejected: {member.name!r}"
                      )
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"unreadable member: {member.name!r}")
                  destination = stage / member.name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read())

          for name in sorted(expected):
              source = stage / name
              destination = Path(name)
              for parent in destination.parents:
                  if parent == Path("."):
                      break
                  if parent.is_symlink():
                      raise SystemExit(f"linked destination ancestor: {parent}")
              if destination.is_symlink():
                  raise SystemExit(f"linked destination rejected: {destination}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)

          shutil.rmtree(stage)
          archive.unlink()
          Path(
              ".github/workflows/unpack-claim-relevant-path-bundle.yml"
          ).unlink()
          PY

      - name: Install dependency-free editable package
        run: python -m pip install --no-deps -e .

      - name: Validate exact preregistration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_public_tree.py
          python -m compileall -q src tests scripts
          python -m unittest -v \
            tests.test_dw001_claim_relevant_path_preregistration \
            tests.test_dw001_claim_relevant_path_adversarial \
            tests.test_dw001_claim_relevant_path_schemas
          python scripts/smoke_dw001_claim_relevant_path_plan.py
          python -m unittest discover -s tests -v
          ./scripts/demo.sh

      - name: Commit exact extracted files and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/claim-relevant-path-preregistration.yml \
            .github/workflows/unpack-claim-relevant-path-bundle.yml \
            research/DW-001/.claim-relevant-path-preregistration.bundle.tar.gz \
            research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_ARCHITECTURE_V1.md \
            research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_PLAN_V1.md \
            research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_PUBLICATION_BOUNDARY_V1.md \
            research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_RED_FIRST_V1.md \
            research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_THREAT_BOUNDARY_V1.md \
            research/DW-001/claim-relevant-path-divergence-catalog.v1.json \
            research/DW-001/claim-relevant-path-divergence-plan.v1.json \
            research/DW-001/claim-relevant-path-prior-art-log.v1.json \
            research/DW-001/schema/claim-relevant-path-divergence-catalog.schema.json \
            research/DW-001/schema/claim-relevant-path-divergence-plan.schema.json \
            research/DW-001/schema/claim-relevant-path-prior-art-log.schema.json \
            scripts/smoke_dw001_claim_relevant_path_plan.py \
            src/deltawitness/dw001_claim_relevant_path_plan.py \
            tests/test_dw001_claim_relevant_path_adversarial.py \
            tests/test_dw001_claim_relevant_path_preregistration.py \
            tests/test_dw001_claim_relevant_path_schemas.py
          test -n "$(git status --short)"
          git commit -m "research: implement claim-relevant path preregistration"
          git push origin HEAD:research/claim-relevant-path-divergence-v1
