name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install without dependency resolution
        run: python -m pip install --no-deps -e .

      - name: Smoke-test editable entry points and DW-001 API
        run: |
          deltawitness --version
          deltawitness-unittest --help >/dev/null
          python -c "from deltawitness.dw001 import project_baselines, verify_projection_document"

      - name: Validate public tree
        run: python scripts/validate_public_tree.py

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end demo
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp -t deltawitness-demo-log-XXXXXX)"
          trap 'rm -f "$log_file"' EXIT
          if ./scripts/demo.sh >"$log_file" 2>&1; then
            cat "$log_file"
            exit 0
          fi

          echo "DeltaWitness end-to-end demonstration failed." >&2
          echo "Only the final 80 lines are emitted; environment values are never dumped." >&2
          tail -n 80 "$log_file" >&2

          diagnostic="$(tail -n 40 "$log_file" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=DeltaWitness end-to-end demo failed::$diagnostic"
          exit 1

      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist

      - name: Verify built wheel, entry points, and DW-001 API
        run: |
          python -m pip install --no-deps --force-reinstall dist/deltawitness-*.whl
          deltawitness --version
          deltawitness-unittest --help >/dev/null
          python -c "from deltawitness.dw001 import project_baselines, verify_projection_document"
