name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install without dependency resolution
        run: python -m pip install --no-deps -e .

      - name: Smoke-test editable entry points and DW-001 APIs
        run: |
          deltawitness --version
          deltawitness-unittest --help >/dev/null
          python -c "from deltawitness.dw001 import project_baselines, verify_projection_document"
          python -c "from deltawitness.dw001_contracts import seal_scenario_manifest, seal_result_record, verify_scenario_manifest_document, verify_result_record_document, verify_result_against_sources"
          python -c "from deltawitness.dw001_scenarios import compute_fixture_specification_sha256, materialize_synthetic_fixture, verify_fixture_identity_document"
          python -c "from deltawitness.dw001_fixture_binding import build_fixture_manifest_binding, compute_fixture_manifest_binding_sha256, verify_fixture_manifest_binding_document"
          python -c "from deltawitness.claim_witness import build_claim_witness_declaration, run_claim_witness_localization, verify_claim_witness_localization_document"
          python -c "from deltawitness.dw001_pilot import build_development_pilot_archive, build_development_pilot_plan, run_development_pilot, verify_development_pilot_archive_document, verify_development_pilot_bundle"
          python scripts/smoke_dw001_fixture_binding.py
          python scripts/smoke_dw001_wrong_reason.py
          python scripts/smoke_dw001_unrelated_assertion.py
          python scripts/smoke_claim_witness_localization.py
          python scripts/smoke_dw001_development_pilot_plan.py

      - name: Validate public tree
        run: python scripts/validate_public_tree.py

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end demo
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp -t deltawitness-demo-log-XXXXXX)"
          trap 'rm -f "$log_file"' EXIT
          if ./scripts/demo.sh >"$log_file" 2>&1; then
            cat "$log_file"
            exit 0
          fi

          echo "DeltaWitness end-to-end demonstration failed." >&2
          echo "Only the final 80 lines are emitted; environment values are never dumped." >&2
          tail -n 80 "$log_file" >&2

          diagnostic="$(tail -n 40 "$log_file" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=DeltaWitness end-to-end demo failed::$diagnostic"
          exit 1

      - name: Build wheel without project dependency resolution
        run: python -m pip wheel --no-deps . --wheel-dir dist

      - name: Verify built wheel, entry points, and DW-001 APIs
        run: |
          python -m pip install --no-deps --force-reinstall dist/deltawitness-*.whl
          deltawitness --version
          deltawitness-unittest --help >/dev/null
          python -c "from deltawitness.dw001 import project_baselines, verify_projection_document"
          python -c "from deltawitness.dw001_contracts import seal_scenario_manifest, seal_result_record, verify_scenario_manifest_document, verify_result_record_document, verify_result_against_sources"
          python -c "from deltawitness.dw001_scenarios import compute_fixture_specification_sha256, materialize_synthetic_fixture, verify_fixture_identity_document"
          python -c "from deltawitness.dw001_fixture_binding import build_fixture_manifest_binding, compute_fixture_manifest_binding_sha256, verify_fixture_manifest_binding_document"
          python -c "from deltawitness.claim_witness import build_claim_witness_declaration, run_claim_witness_localization, verify_claim_witness_localization_document"
          python -c "from deltawitness.dw001_pilot import build_development_pilot_archive, build_development_pilot_plan, run_development_pilot, verify_development_pilot_archive_document, verify_development_pilot_bundle"
          python scripts/smoke_dw001_fixture_binding.py
          python scripts/smoke_dw001_wrong_reason.py
          python scripts/smoke_dw001_unrelated_assertion.py
          python scripts/smoke_claim_witness_localization.py
          python scripts/smoke_dw001_development_pilot_plan.py

  canonical-archive-write:
    name: One-time canonical archive branch write
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/dw-001-development-pilot-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reject unauthorized target or completed transport
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_HEAD_REF}" != "research/dw-001-development-pilot-v1" ]]; then
            echo "Unexpected head ref: ${GITHUB_HEAD_REF}" >&2
            exit 1
          fi
          if [[ "${GITHUB_HEAD_REF}" == "main" ]]; then
            echo "Refusing to write main." >&2
            exit 1
          fi
          if [[ -e research/DW-001/development-pilot-archive.v1.json ]]; then
            echo "Archive already exists; no write is authorized."
            echo "write_required=false" >>"${GITHUB_OUTPUT}"
          else
            echo "write_required=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Set up Python 3.11
        if: steps.guard.outputs.write_required == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install without dependency resolution
        if: steps.guard.outputs.write_required == 'true'
        run: python -m pip install --no-deps -e .

      - name: Render and verify exact canonical archive
        if: steps.guard.outputs.write_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/DW-001/development-pilot-archive.v1
          python scripts/render_dw001_development_pilot_archive.py \
            --output research/DW-001/development-pilot-archive.v1.json
          python - <<'PY'
          from pathlib import Path
          from deltawitness.dw001_pilot import verify_development_pilot_archive_document
          from deltawitness.reporting import load_report

          root = Path("research/DW-001")
          plan = load_report(root / "development-pilot-plan.v1.json")
          archive = load_report(root / "development-pilot-archive.v1.json")
          valid, errors = verify_development_pilot_archive_document(archive, plan)
          if not valid:
              raise SystemExit("; ".join(errors))
          print(
              "verified archive "
              f"archive_sha256={archive['archive_sha256']} "
              f"semantic_sha256={archive['index_semantic_sha256']}"
          )
          PY

      - name: Enforce exact staged-path allowlist
        if: steps.guard.outputs.write_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            research/DW-001/development-pilot-archive.v1.json \
            research/DW-001/development-pilot-archive.v1
          mapfile -t changed < <(git diff --cached --name-only)
          if [[ "${#changed[@]}" -lt 1 || "${#changed[@]}" -gt 2 ]]; then
            printf 'Unexpected staged path count: %s\n' "${#changed[@]}" >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi
          archive_seen=false
          for path in "${changed[@]}"; do
            case "${path}" in
              research/DW-001/development-pilot-archive.v1.json)
                archive_seen=true
                ;;
              research/DW-001/development-pilot-archive.v1/manifest.json)
                if [[ "$(git diff --cached --diff-filter=D --name-only -- "${path}")" != "${path}" ]]; then
                  echo "Segmented transport manifest may only be deleted." >&2
                  exit 1
                fi
                ;;
              *)
                echo "Unauthorized staged path: ${path}" >&2
                exit 1
                ;;
            esac
          done
          if [[ "${archive_seen}" != true ]]; then
            echo "Canonical archive was not staged." >&2
            exit 1
          fi
          git diff --cached --check
          git diff --cached --stat

      - name: Commit exact archive to PR branch
        if: steps.guard.outputs.write_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: retain canonical DW-001 development pilot archive"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
