name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install without dependency resolution
        run: python -m pip install --no-deps -e .

      - name: Smoke-test editable entry points and DW-001 APIs
        run: |
          deltawitness --version
          deltawitness-unittest --help >/dev/null
          python -c "from deltawitness.dw001 import project_baselines, verify_projection_document"
          python -c "from deltawitness.dw001_contracts import seal_scenario_manifest, seal_result_record, verify_scenario_manifest_document, verify_result_record_document, verify_result_against_sources"
          python -c "from deltawitness.dw001_scenarios import compute_fixture_specification_sha256, materialize_synthetic_fixture, verify_fixture_identity_document"
          python -c "from deltawitness.dw001_fixture_binding import build_fixture_manifest_binding, compute_fixture_manifest_binding_sha256, verify_fixture_manifest_binding_document"
          python -c "from deltawitness.claim_witness import build_claim_witness_declaration, run_claim_witness_localization, verify_claim_witness_localization_document"
          python -c "from deltawitness.dw001_oracle_challenge import run_weak_proxy_oracle_challenge, verify_weak_oracle_challenge_document"
          python -c "from deltawitness.dw001_mutation_plan import build_claim_scoped_mutant_catalog, build_claim_scoped_mutation_plan, verify_claim_scoped_mutant_catalog_document, verify_claim_scoped_mutation_plan_document"
          python -c "from deltawitness.dw001_mutation_results import run_claim_scoped_mutation_result, verify_claim_scoped_mutation_result_document"
          python -c "from deltawitness.dw001_statement_coverage import run_claim_scoped_statement_coverage, verify_claim_scoped_statement_coverage_document"
          python -c "import sys; from deltawitness.coveragepy_contract import build_coveragepy_distribution_manifest; from deltawitness.dw001_coveragepy_baseline import verify_claim_scoped_coveragepy_baseline_document; assert 'coverage' not in sys.modules"
          python -c "from deltawitness.dw001_pilot import build_development_pilot_archive, build_development_pilot_plan, run_development_pilot, verify_development_pilot_archive_document, verify_development_pilot_bundle"
          python scripts/smoke_dw001_fixture_binding.py
          python scripts/smoke_dw001_wrong_reason.py
          python scripts/smoke_dw001_unrelated_assertion.py
          python scripts/smoke_claim_witness_localization.py
          python scripts/smoke_dw001_weak_proxy_oracle.py
          python scripts/smoke_dw001_mutation_plan.py
          python scripts/smoke_dw001_mutation_results.py
          python scripts/smoke_dw001_statement_coverage.py
          python scripts/smoke_dw001_development_pilot_plan.py
          python scripts/smoke_dw001_development_pilot.py

      - name: Validate public tree
        run: python scripts/validate_public_tree.py

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end demo
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp -t deltawitness-demo-log-XXXXXX)"
          trap 'rm -f "$log_file"' EXIT
          if ./scripts/demo.sh >"$log_file" 2>&1; then
            cat "$log_file"
            exit 0
          fi

          echo "DeltaWitness end-to-end demonstration failed." >&2
          echo "Only the final 80 lines are emitted; environment values are never dumped." >&2
          tail -n 80 "$log_file" >&2

          diagnostic="$(tail -n 40 "$log_file" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::error title=DeltaWitness end-to-end demo failed::$diagnostic"
          exit 1

      - name: Build wheel without project dependency resolution
        run: python -m pip wheel --no-deps . --wheel-dir dist

      - name: Verify built wheel, entry points, and DW-001 APIs
        run: |
          python -m pip install --no-deps --force-reinstall dist/deltawitness-*.whl
          deltawitness --version
          deltawitness-unittest --help >/dev/null
          python -c "from deltawitness.dw001 import project_baselines, verify_projection_document"
          python -c "from deltawitness.dw001_contracts import seal_scenario_manifest, seal_result_record, verify_scenario_manifest_document, verify_result_record_document, verify_result_against_sources"
          python -c "from deltawitness.dw001_scenarios import compute_fixture_specification_sha256, materialize_synthetic_fixture, verify_fixture_identity_document"
          python -c "from deltawitness.dw001_fixture_binding import build_fixture_manifest_binding, compute_fixture_manifest_binding_sha256, verify_fixture_manifest_binding_document"
          python -c "from deltawitness.claim_witness import build_claim_witness_declaration, run_claim_witness_localization, verify_claim_witness_localization_document"
          python -c "from deltawitness.dw001_oracle_challenge import run_weak_proxy_oracle_challenge, verify_weak_oracle_challenge_document"
          python -c "from deltawitness.dw001_mutation_plan import build_claim_scoped_mutant_catalog, build_claim_scoped_mutation_plan, verify_claim_scoped_mutant_catalog_document, verify_claim_scoped_mutation_plan_document"
          python -c "from deltawitness.dw001_mutation_results import run_claim_scoped_mutation_result, verify_claim_scoped_mutation_result_document"
          python -c "from deltawitness.dw001_statement_coverage import run_claim_scoped_statement_coverage, verify_claim_scoped_statement_coverage_document"
          python -c "import sys; from deltawitness.coveragepy_contract import build_coveragepy_distribution_manifest; from deltawitness.dw001_coveragepy_baseline import verify_claim_scoped_coveragepy_baseline_document; assert 'coverage' not in sys.modules"
          python -c "from deltawitness.dw001_pilot import build_development_pilot_archive, build_development_pilot_plan, run_development_pilot, verify_development_pilot_archive_document, verify_development_pilot_bundle"
          python scripts/smoke_dw001_fixture_binding.py
          python scripts/smoke_dw001_wrong_reason.py
          python scripts/smoke_dw001_unrelated_assertion.py
          python scripts/smoke_claim_witness_localization.py
          python scripts/smoke_dw001_weak_proxy_oracle.py
          python scripts/smoke_dw001_mutation_plan.py
          python scripts/smoke_dw001_mutation_results.py
          python scripts/smoke_dw001_statement_coverage.py
          python scripts/smoke_dw001_development_pilot_plan.py
          python scripts/smoke_dw001_development_pilot.py

  coveragepy-research:
    name: Coverage.py research / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency-free DeltaWitness base
        run: python -m pip install --no-deps -e .

      - name: Download the exact reviewed universal wheel
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/coveragepy-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m pip download \
            --dest "$wheelhouse" \
            --require-hashes \
            --no-deps \
            --only-binary=:all: \
            --platform any \
            --implementation py \
            --abi none \
            --python-version "${{ matrix.python-version }}" \
            -r research/requirements-coveragepy-v1.txt
          test "$(find "$wheelhouse" -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Verify and install the artifact offline
        shell: bash
        run: |
          set -euo pipefail
          wheel="${RUNNER_TEMP}/coveragepy-wheelhouse/coverage-7.15.2-py3-none-any.whl"
          python scripts/verify_coveragepy_artifact.py "$wheel"
          python -m pip install --no-index --no-deps "$wheel"

      - name: Verify exact runtime identity and inactive auto-start
        run: |
          python - <<'PY'
          import importlib.metadata
          import coverage

          assert importlib.metadata.version("coverage") == "7.15.2"
          assert coverage.__version__ == "7.15.2"
          assert coverage.Coverage.current() is None
          PY

      - name: Run research contract and editable baseline smoke
        run: |
          python -m unittest discover -s tests/research -v
          python scripts/smoke_dw001_coveragepy_baseline.py

      - name: Emit reviewed canonical result for freezing
        if: matrix.python-version == '3.11'
        run: python scripts/smoke_dw001_coveragepy_baseline.py --emit-json

      - name: Reproduce semantic result from the installed base wheel
        shell: bash
        run: |
          set -euo pipefail
          editable_digest="$(python scripts/smoke_dw001_coveragepy_baseline.py --semantic-digest)"
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps --force-reinstall dist/deltawitness-*.whl
          installed_digest="$(python scripts/smoke_dw001_coveragepy_baseline.py --semantic-digest)"
          test "$editable_digest" = "$installed_digest"
          echo "Coverage.py semantic reproduction passed: ${installed_digest}"

      - name: Install the optional research extra from the offline wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/coveragepy-wheelhouse"
          cp dist/deltawitness-*.whl "$wheelhouse/"
          venv="${RUNNER_TEMP}/coveragepy-extra-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install \
            --no-index \
            --find-links "$wheelhouse" \
            'deltawitness[research]==0.0.3'
          "$venv/bin/python" - <<'PY'
          import importlib.metadata
          import coverage
          import deltawitness

          assert deltawitness.__version__ == "0.0.3"
          assert importlib.metadata.version("coverage") == "7.15.2"
          assert coverage.__version__ == "7.15.2"
          assert coverage.Coverage.current() is None
          PY

      - name: Remove Coverage.py and revalidate the base product path
        run: |
          python -m pip uninstall --yes coverage
          python - <<'PY'
          import importlib.util
          import sys

          assert importlib.util.find_spec("coverage") is None
          from deltawitness.coveragepy_contract import (
              build_coveragepy_distribution_manifest,
          )
          from deltawitness.dw001_statement_coverage import (
              verify_claim_scoped_statement_coverage_document,
          )
          assert "coverage" not in sys.modules
          assert build_coveragepy_distribution_manifest()["version"] == "7.15.2"
          PY
          python scripts/smoke_dw001_statement_coverage.py
