name: Apply reviewed DW-001 claim-path preregistration

on:
  push:
    branches:
      - research/claim-relevant-path-divergence-v1
    paths:
      - .github/workflows/dw51-autonomous-apply.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  TARGET_BRANCH: research/claim-relevant-path-divergence-v1
  PR_NUMBER: "51"

concurrency:
  group: dw51-one-time-reconstruction
  cancel-in-progress: false

jobs:
  apply:
    name: Reconstruct, validate, and publish one ordinary commit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/claim-relevant-path-divergence-v1
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Reconstruct exact v1 and run pre-publication gates
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 818fa19da69e50319325b2544832fd1b7833b0e9 HEAD

          for script in \
            .github/dw51-reconstruction/code.py \
            .github/dw51-reconstruction/tests_v2.py \
            .github/dw51-reconstruction/docs_v2.py \
            .github/dw51-reconstruction/workflows_v2.py
          do
            test -f "$script"
            test ! -L "$script"
            python "$script"
          done

          rm -rf .github/dw51-reconstruction .github/dw51-text-transport
          rm -rf research/DW-001/.claim-relevant-path-transport-recovery
          rm -f .github/workflows/dw51-autonomous-apply.yml
          rm -f .github/workflows/dw51-text-transport.yml
          rm -f .github/workflows/unpack-claim-relevant-path-bundle.yml
          rm -f research/DW-001/.claim-relevant-path-preregistration.bundle.tar.gz
          rm -f research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_CI_TRIGGER_RECEIPT_V1.md
          rm -f .connector-file-probe .dw-inline-tree-probe .dw51-tree-content-probe

          python -m pip uninstall --yes coverage || true
          python -m pip install --no-deps -e .
          python -m unittest -v \
            tests.test_dw001_claim_relevant_path_preregistration \
            tests.test_dw001_claim_relevant_path_adversarial \
            tests.test_dw001_claim_relevant_path_schemas 2>&1 | tee /tmp/dw51-targeted.log
          python scripts/smoke_dw001_claim_relevant_path_plan.py
          python scripts/validate_public_tree.py
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/dw51-full.log
          ./scripts/demo.sh

          python - <<'PY'
          import importlib.util
          import sys
          from deltawitness.dw001_claim_relevant_path_plan import (
              CATALOG_SHA256,
              INFLUENCE_CONTROL_SHA256,
              PLAN_SHA256,
              PRIOR_ART_LOG_SHA256,
              SOURCE_AST_SHA256,
              SOURCE_SHA256,
              TEST_SHA256,
          )

          expected = {
              "source": "8c1bdd26c2e98cd209f210630bfe4d274a3dcd7bbd042db8b8586c7750814327",
              "source_ast": "dabb7011748968f8d43d590ff843a91697a3344a2400d7cabaf926b79ca88e2d",
              "test": "8a26d52fa7fbb4ab7fc6eab466d9051cd329b0da09a667b5e220fbbfd416d1e9",
              "influence": "7b068d2f71003fade4eca77e1aa9cdb3a0f2f526f89dbd4828d4f17fbf2bd4f5",
              "plan": "ff0403132c3424fc7309a15a05794eed93ac9eb526de172e17326f8409ca0888",
              "catalog": "f36fbe58c00cfb8ed0fd994f3bb1dcdb45040774f7ae4663563b9f40ac15daa5",
              "prior_art": "5f697631a5ded7a413dd11f4da0606ee8809e2b0f5de257ecab53a7e2d7f790c",
          }
          observed = {
              "source": SOURCE_SHA256,
              "source_ast": SOURCE_AST_SHA256,
              "test": TEST_SHA256,
              "influence": INFLUENCE_CONTROL_SHA256,
              "plan": PLAN_SHA256,
              "catalog": CATALOG_SHA256,
              "prior_art": PRIOR_ART_LOG_SHA256,
          }
          assert observed == expected, (observed, expected)
          assert importlib.util.find_spec("coverage") is None
          assert "coverage" not in sys.modules
          PY

          rm -rf build dist
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps --force-reinstall dist/deltawitness-*.whl
          python scripts/smoke_dw001_claim_relevant_path_plan.py
          python - <<'PY'
          import importlib.util
          import sys
          assert importlib.util.find_spec("coverage") is None
          assert "coverage" not in sys.modules
          PY

          targeted="$(grep -Eo 'Ran [0-9]+ tests?' /tmp/dw51-targeted.log | tail -1 | awk '{print $2}')"
          complete="$(grep -Eo 'Ran [0-9]+ tests?' /tmp/dw51-full.log | tail -1 | awk '{print $2}')"
          test -n "$targeted"
          test -n "$complete"
          echo "targeted=$targeted" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf build dist
          git status --short
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: implement exact claim-path preregistration"
          generated_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "generated_head=$generated_head" >> "$GITHUB_OUTPUT"

      - name: Record successful reconstruction
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_HEAD: ${{ steps.reconstruct.outputs.generated_head }}
          TARGETED: ${{ steps.reconstruct.outputs.targeted }}
          COMPLETE: ${{ steps.reconstruct.outputs.complete }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = f"""## Exact v1 reconstruction published

```text
starting_head: {os.environ['GITHUB_SHA']}
generated_head: {os.environ['GENERATED_HEAD']}
targeted_tests: {os.environ['TARGETED']} passed
full_tests: {os.environ['COMPLETE']} passed
public_tree: PASS
compileall: PASS
demo: PASS
editable_install: PASS
wheel_reinstall: PASS
frozen_identities: EXACT
Coverage.py_import: ABSENT
candidate_execution: NOT_AUTHORIZED
```

The generated commit removes all reconstruction, transport, recovery, and one-time workflow material. Final-head CI must still run and pass before review or merge."""
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY

      - name: Record fail-closed reconstruction failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = f"""## Exact v1 reconstruction failed closed

```text
head: {os.environ['GITHUB_SHA']}
run_id: {os.environ['GITHUB_RUN_ID']}
```

No reviewed identity, validator, test, allowlist, or claim boundary was weakened. The branch was not advanced by this job; candidate and result execution remain unauthorized."""
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY
