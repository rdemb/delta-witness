name: Apply reviewed DW-001 claim-path preregistration

on:
  push:
    branches: [research/claim-relevant-path-divergence-v1]
    paths: [.github/workflows/dw51-autonomous-apply.yml]

permissions:
  contents: write
  issues: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  TARGET_BRANCH: research/claim-relevant-path-divergence-v1
  PR_NUMBER: "51"
  KNOWN_CLEANUP_COMMIT: 818fa19da69e50319325b2544832fd1b7833b0e9

concurrency:
  group: dw51-autonomous-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/claim-relevant-path-divergence-v1
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Reconstruct and clean the reviewed tree
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$KNOWN_CLEANUP_COMMIT" HEAD
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"

          for path in \
            .github/dw51-reconstruction/code.py \
            .github/dw51-reconstruction/tests_v2.py \
            .github/dw51-reconstruction/docs_v2.py \
            .github/dw51-reconstruction/workflows_v2.py
          do
            test -f "$path"
            test ! -L "$path"
          done

          python .github/dw51-reconstruction/code.py
          python .github/dw51-reconstruction/tests_v2.py
          python .github/dw51-reconstruction/docs_v2.py
          python .github/dw51-reconstruction/workflows_v2.py

          rm -rf .github/dw51-reconstruction .github/dw51-text-transport
          rm -rf research/DW-001/.claim-relevant-path-transport-recovery
          rm -f .github/workflows/dw51-autonomous-apply.yml
          rm -f .github/workflows/dw51-text-transport.yml
          rm -f .github/workflows/unpack-claim-relevant-path-bundle.yml
          rm -f research/DW-001/.claim-relevant-path-preregistration.bundle.tar.gz
          rm -f research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_CI_TRIGGER_RECEIPT_V1.md
          rm -f .connector-file-probe .dw-inline-tree-probe .dw51-tree-content-probe

          cat > /tmp/dw51-pre-gate-paths <<'EOF'
          .github/workflows/claim-relevant-path-preregistration.yml
          README.md
          ROADMAP.md
          THREAT_MODEL.md
          docs/ARCHITECTURE.md
          docs/PUBLICATION_POLICY.md
          research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_ADVERSARIAL_REVIEW_V1.md
          research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_ARCHITECTURE_V1.md
          research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_PLAN_V1.md
          research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_PUBLICATION_BOUNDARY_V1.md
          research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_RED_FIRST_V1.md
          research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_THREAT_BOUNDARY_V1.md
          research/DW-001/claim-relevant-path-divergence-catalog.v1.json
          research/DW-001/claim-relevant-path-divergence-plan.v1.json
          research/DW-001/claim-relevant-path-prior-art-log.v1.json
          research/DW-001/schema/claim-relevant-path-divergence-catalog.schema.json
          research/DW-001/schema/claim-relevant-path-divergence-plan.schema.json
          research/DW-001/schema/claim-relevant-path-prior-art-log.schema.json
          scripts/smoke_dw001_claim_relevant_path_plan.py
          src/deltawitness/dw001_claim_relevant_path_plan.py
          tests/test_dw001_claim_relevant_path_adversarial.py
          tests/test_dw001_claim_relevant_path_preregistration.py
          tests/test_dw001_claim_relevant_path_schemas.py
          EOF
          sed -i 's/^          //' /tmp/dw51-pre-gate-paths
          sort -o /tmp/dw51-pre-gate-paths /tmp/dw51-pre-gate-paths
          git add -A
          git diff --cached --name-only origin/main | sort > /tmp/dw51-observed
          diff -u /tmp/dw51-pre-gate-paths /tmp/dw51-observed

          while IFS= read -r path; do
            test -f "$path"
            test ! -L "$path"
          done < /tmp/dw51-pre-gate-paths

          for path in \
            .github/dw51-reconstruction \
            .github/dw51-text-transport \
            .github/workflows/dw51-autonomous-apply.yml \
            .github/workflows/dw51-text-transport.yml \
            .github/workflows/unpack-claim-relevant-path-bundle.yml \
            research/DW-001/.claim-relevant-path-transport-recovery \
            research/DW-001/.claim-relevant-path-preregistration.bundle.tar.gz \
            research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_CI_TRIGGER_RECEIPT_V1.md
          do
            test ! -e "$path"
            test ! -L "$path"
          done

      - name: Run design-only validation
        run: |
          set -euo pipefail
          python -m pip uninstall --yes coverage || true
          python -m pip install --no-deps -e .
          python -m unittest -v \
            tests.test_dw001_claim_relevant_path_preregistration \
            tests.test_dw001_claim_relevant_path_adversarial \
            tests.test_dw001_claim_relevant_path_schemas 2>&1 | tee /tmp/dw51-targeted.log
          python scripts/smoke_dw001_claim_relevant_path_plan.py
          python scripts/validate_public_tree.py
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests 2>&1 | tee /tmp/dw51-full.log
          ./scripts/demo.sh
          test "$(python - <<'PY'
          import importlib.util
          import sys
          print(importlib.util.find_spec("coverage") is None and "coverage" not in sys.modules)
          PY
          )" = "True"

      - name: Reproduce installed wheel and frozen identities
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps --force-reinstall dist/deltawitness-*.whl
          python scripts/smoke_dw001_claim_relevant_path_plan.py
          python - <<'PY'
          import importlib.util
          import sys
          from deltawitness.dw001_claim_relevant_path_plan import (
              CATALOG_SHA256,
              INFLUENCE_CONTROL_SHA256,
              PLAN_SHA256,
              PRIOR_ART_LOG_SHA256,
              SOURCE_AST_SHA256,
              SOURCE_SHA256,
              TEST_SHA256,
          )
          assert importlib.util.find_spec("coverage") is None
          assert "coverage" not in sys.modules
          assert SOURCE_SHA256 == "8c1bdd26c2e98cd209f210630bfe4d274a3dcd7bbd042db8b8586c7750814327"
          assert SOURCE_AST_SHA256 == "dabb7011748968f8d43d590ff843a91697a3344a2400d7cabaf926b79ca88e2d"
          assert TEST_SHA256 == "8a26d52fa7fbb4ab7fc6eab466d9051cd329b0da09a667b5e220fbbfd416d1e9"
          assert INFLUENCE_CONTROL_SHA256 == "7b068d2f71003fade4eca77e1aa9cdb3a0f2f526f89dbd4828d4f17fbf2bd4f5"
          assert PLAN_SHA256 == "ff0403132c3424fc7309a15a05794eed93ac9eb526de172e17326f8409ca0888"
          assert CATALOG_SHA256 == "f36fbe58c00cfb8ed0fd994f3bb1dcdb45040774f7ae4663563b9f40ac15daa5"
          assert PRIOR_ART_LOG_SHA256 == "5f697631a5ded7a413dd11f4da0606ee8809e2b0f5de257ecab53a7e2d7f790c"
          PY
          rm -rf build dist

      - name: Commit and publish exact final tree
        id: publish
        run: |
          set -euo pipefail
          targeted="$(grep -Eo 'Ran [0-9]+ tests?' /tmp/dw51-targeted.log | tail -1 | awk '{print $2}')"
          complete="$(grep -Eo 'Ran [0-9]+ tests?' /tmp/dw51-full.log | tail -1 | awk '{print $2}')"
          test -n "$targeted"
          test -n "$complete"
          cat > research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_LOCAL_GATE_RECEIPT_V1.md <<EOF
          # DW-001 Claim-Relevant Path Divergence Local Gate Receipt v1

          - Starting branch SHA: \`$GITHUB_SHA\`
          - Targeted contract/adversarial/schema tests: \`$targeted\` passed
          - Complete repository regression tests: \`$complete\` passed
          - Public-tree validation: \`PASS\`
          - Python compilation: \`PASS\`
          - End-to-end demo: \`PASS\`
          - Design-only smoke: \`PASS\`
          - Dependency-free editable install: \`PASS\`
          - Wheel build, force reinstall, and smoke: \`PASS\`
          - Coverage.py import during preregistration checks: \`ABSENT\`
          - Candidate/selector/Coverage.py/fault/influence/target execution: \`NOT AUTHORIZED\`
          - Plan SHA-256: \`ff0403132c3424fc7309a15a05794eed93ac9eb526de172e17326f8409ca0888\`
          - Catalog SHA-256: \`f36fbe58c00cfb8ed0fd994f3bb1dcdb45040774f7ae4663563b9f40ac15daa5\`
          - Prior-art log SHA-256: \`5f697631a5ded7a413dd11f4da0606ee8809e2b0f5de257ecab53a7e2d7f790c\`

          This receipt records local repository gates before branch publication. It is not final-head CI evidence and does not expand the design-only claim boundary.
          EOF
          sed -i 's/^          //' research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_LOCAL_GATE_RECEIPT_V1.md

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf build dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          cp /tmp/dw51-pre-gate-paths /tmp/dw51-final-paths
          echo research/DW-001/CLAIM_RELEVANT_PATH_DIVERGENCE_LOCAL_GATE_RECEIPT_V1.md >> /tmp/dw51-final-paths
          sort -o /tmp/dw51-final-paths /tmp/dw51-final-paths
          git diff --cached --name-only origin/main | sort > /tmp/dw51-observed
          diff -u /tmp/dw51-final-paths /tmp/dw51-observed

          git commit -m "research: implement exact claim-path preregistration"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "generated_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_HEAD: ${{ steps.publish.outputs.generated_head }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = (
              "## Reconstruction gate passed\n\n"
              "```text\n"
              f"starting_head: {os.environ['GITHUB_SHA']}\n"
              f"published_head: {os.environ['GENERATED_HEAD']}\n"
              "public_tree: PASS\nfull_suite: PASS\ndemo: PASS\n"
              "editable_and_wheel: PASS\ntransient_files: REMOVED\n"
              "candidate_execution: NOT_AUTHORIZED\n```\n\n"
              "An external exact-content receipt commit is still required before final-head CI."
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"},
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = (
              "## Reconstruction gate failed closed\n\n"
              f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n"
              "No validator, digest, test, allowlist, or claim boundary was weakened. "
              "Merge and candidate execution remain unauthorized."
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"},
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY
